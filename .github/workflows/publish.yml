# Build the Klepto Cartographer image and publish it to GitHub Container Registry.
#   push to main  -> ghcr.io/shubniguroth/kleptocartography:latest  (+ :sha-xxxxxxx)
#   tag v1.2.3    -> ghcr.io/shubniguroth/kleptocartography:1.2.3
# Portainer (or any Docker host) pulls :latest ("Re-pull image" when updating a stack).
name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  secret-guard:
    # Fails the run if anything that looks like a credential was committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to build if secrets are committed
        run: |
          set -u
          fail=0
          for f in stack.env .env; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error file=$f::$f is tracked by git; it must never be committed"; fail=1
            fi
          done
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- . ; then
            echo "::error::Google API key pattern found"; fail=1
          fi
          if git grep -nE '^(TILE_PASSWORD|TILE_EMAIL|GOOGLE_MAPS_JS_KEY|GOOGLE_GEOCODING_KEY|CLOUDFLARE_TUNNEL_TOKEN|APPRISE_URLS|HEALTHCHECKS_URL)=.+' -- . ; then
            echo "::error::A secret variable has a value in a committed file"; fail=1
          fi
          if git grep -nE 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' -- . ; then
            echo "::error::Token-like string (JWT / tunnel token) found"; fail=1
          fi
          exit $fail

  build:
    needs: secret-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
