<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">
  <title>Klepto Cartographer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23111317'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23ffd166'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23ffd166' stroke-width='3' stroke-dasharray='4 5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/app.css?v={{VERSION}}">
</head>
<body>
  <div id="map" aria-label="Map of tracker locations"></div>

  <aside id="panel" aria-label="Trackers">
    <header class="panel-head">
      <div class="brand">
        <h1 id="title">Klepto Cartographer</h1>
        <p id="subtitle"></p>
      </div>
      <button id="collapse" class="icon-btn" type="button" aria-label="Collapse panel" title="Collapse panel">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div id="pollbar" class="pollbar" role="status" aria-live="polite">
      <span class="dot"></span>
      <span id="polltext">Connecting&hellip;</span>
      <button id="refresh" class="link-btn" type="button">Refresh</button>
    </div>

    <div id="banners"></div>
    <div id="summary" class="summary"></div>
    <ul id="list" class="list"></ul>

    <details id="activity" class="activity">
      <summary>Activity</summary>
      <ol id="events"></ol>
    </details>

    <footer id="foot" class="foot"></footer>
  </aside>

  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/vendor/googlemutant/Leaflet.GoogleMutant.js"></script>
  <script src="/static/app.js?v={{VERSION}}"></script>
</body>
</html>
